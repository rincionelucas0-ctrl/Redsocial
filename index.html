function renderSearch(){const query=state.query.trim().toLocaleLowerCase('es-AR');let data=state.searchMode==='personas'?people:state.posts.filter(p=>p.type==='offer');data=data.filter(item=>{const s=state.searchMode==='personas'?[item.name,item.role,item.zone,item.intro,...item.skills].join(' '):[item.title,item.author,item.company,item.zone,item.text,...(item.skills||[])].join(' ');return (!query||s.toLocaleLowerCase('es-AR').includes(query))&&(!state.filters.zone||String(item.zone||'').toLocaleLowerCase('es-AR').includes(state.filters.zone.toLocaleLowerCase('es-AR')))&&(!state.filters.availability||state.searchMode!=='personas'||String(item.availability).toLowerCase().includes(state.filters.availability.toLowerCase()))&&(!state.filters.modality||state.searchMode==='personas'||String(item.modality).toLowerCase().includes(state.filters.modality.toLowerCase()))});if(state.sort==='recent'&&state.searchMode==='ofertas')data=data.slice().reverse();return `${pageHead('Buscar','Encontrá personas, equipos y oportunidades laborales.','Explorá la comunidad')}<div class="searchbar-wrap"><div class="search-field-wrap">${icon('spark',17)}<input class="search-input" id="search-query" value="${html(state.query)}" placeholder="Puesto, habilidad o persona…" aria-label="Buscar"><button class="text-link ${state.query?'':'hidden'}" data-action="clear-search" aria-label="Borrar búsqueda">×</button></div><button class="btn btn-secondary" data-action="toggle-filters">${icon('filter',16)} Filtros</button></div><div class="segmented"><button class="segment-btn ${state.searchMode==='personas'?'active':''}" data-action="search-mode" data-mode="personas">Personas</button><button class="segment-btn ${state.searchMode==='ofertas'?'active':''}" data-action="search-mode" data-mode="ofertas">Ofertas laborales</button></div>${state.showFilters?`<div class="filters-panel"><div class="field"><label for="filter-zone">Zona o ciudad</label><input id="filter-zone" value="${html(state.filters.zone)}" placeholder="Ej. Palermo, CABA"></div>${state.searchMode==='personas'?`<div class="field"><label for="filter-availability">Disponibilidad</label><select id="filter-availability"><option value="">Todas</option><option ${state.filters.availability==='inmediato'?'selected':''} value="inmediato">Disponible de inmediato</option><option ${state.filters.availability==='noviembre'?'selected':''} value="noviembre">Desde noviembre</option></select></div>`:`<div class="field"><label for="filter-modality">Modalidad</label><select id="filter-modality"><option value="">Todas</option><option ${state.filters.modality==='permanente'?'selected':''} value="Permanente">Permanente</option><option ${state.filters.modality==='temporal'?'selected':''} value="Temporal">Temporal</option><option ${state.filters.modality==='día'?'selected':''} value="día">Por día</option></select></div>`}<div class="field"><label for="search-sort">Ordenar por</label><select id="search-sort"><option value="relevance" ${state.sort==='relevance'?'selected':''}>Relevancia</option><option value="recent" ${state.sort==='recent'?'selected':''}>Más recientes</option></select></div><div style="grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px"><button class="btn btn-quiet btn-small" data-action="clear-filters">Limpiar</button><button class="btn btn-primary btn-small" data-action="apply-filters">Aplicar filtros</button></div></div>`:''}<div class="search-results-head"><span class="result-count">${data.length} ${state.searchMode==='personas'?'perfiles':'ofertas'} encontrados</span><span class="muted" style="font-size:10px">${state.sort==='recent'?'Más recientes primero':'Ordenados por relevancia'}</span></div>${data.length?(state.searchMode==='personas'?`<div class="people-grid">${data.map(renderPersonCard).join('')}</div>`:data.map(p=>`<div class="post-card offer-card"><div class="offer-top"><span class="offer-label">${icon('briefcase',13)} Oferta laboral</span><span class="offer-mode">${html(p.modality)}</span></div><h2 class="offer-title">${html(p.title)}</h2><div class="offer-company"><div class="company-avatar">${html((p.company||p.author).split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())}</div><div><strong>${html(p.company||p.author)}</strong><div class="person-sub">${html(p.zone)} · ${html(p.workMode)}</div></div></div><p class="post-text" style="margin-top:13px">${html(p.text)}</p><div class="offer-summary"><span>${icon('pin',14)} ${html(p.zone)}</span><span>${icon('clock',14)} ${html(p.modality)}</span></div><p class="offer-pay">${html(p.pay)} <span style="font-size:11px;color:#7b837c;font-weight:650">${html(p.payPeriod||'')}</span></p><div class="right-action-row" style="margin:14px 0 18px"><button class="btn btn-primary btn-small" data-action="open-offer" data-id="${html(p.id)}">Ver detalles ${icon('arrow',13)}</button><button class="btn btn-secondary btn-small" data-action="save" data-id="${html(p.id)}">${icon('bookmark',14)} ${isSaved(p.id)?'Guardada':'Guardar'}</button></div></div>`).join('')):`<div class="empty-state">${icon('spark',24)}<strong>No se encontraron resultados</strong><p>Probá con otra búsqueda o ajustá los filtros.</p></div>`}`}
function getComposer(){if(!state.composer){const saved=loadJSON('rsl-current-draft',null);state.composer=saved?{...saved,media:[],step:1}:newComposer()}return state.composer}
function newComposer(){return{id:'draft-current',type:'professional',step:1,text:'',title:'',company:'',zone:'',pay:'',payPeriod:'mes',modality:'Permanente',workMode:'Híbrido',schedule:'',skills:[],media:[],description:''}}
function composerToDraft(c){const copy={...c,media:[],step:1,updatedAt:Date.now()};delete copy._files;return copy}
function autosaveComposer(){const c=state.composer;if(!c)return;storeValue('rsl-current-draft',JSON.stringify(composerToDraft(c)));const el=$('#autosave-status');if(el)el.innerHTML=`${icon('check',12)} Guardado automáticamente`}
function draftLabel(d){return d.type==='offer'?(d.title||'Oferta laboral sin título'):(d.text||'Publicación profesional sin texto').slice(0,45)}
function renderDrafts(){if(!state.drafts.length)return '';return `<section class="form-card"><div class="drafts-head"><h2>Tus borradores</h2><span class="pill-note">${state.drafts.length} guardado${state.drafts.length===1?'':'s'}</span></div><p class="muted" style="font-size:11px;margin:0 0 13px">Podés retomarlos cuando quieras. El borrador actual también se guarda automáticamente.</p>${state.drafts.map(d=>`<div class="draft-card"><div class="draft-icon">${icon(d.type==='offer'?'briefcase':'file',18)}</div><div class="draft-info"><strong>${html(draftLabel(d))}</strong><small>${d.type==='offer'?'Oferta laboral':'Publicación profesional'} · Guardado ${new Date(d.updatedAt||Date.now()).toLocaleDateString('es-AR')}</small></div><div class="draft-actions"><button class="btn btn-secondary btn-small" data-action="resume-draft" data-id="${html(d.id)}">Continuar</button><button class="icon-btn" style="height:32px;width:32px;border-radius:9px" data-action="delete-draft" data-id="${html(d.id)}" aria-label="Eliminar borrador">${icon('trash',14)}</button></div></div>`).join('')}</section>`}
function renderComposerSteps(c){return `<div class="steps"><div class="step ${c.step===1?'active':'done'}"><span class="step-num">${c.step>1?icon('check',13):'1'}</span>Contenido</div><div class="step-line"></div><div class="step ${c.step===2?'active':c.step===3?'done':''}"><span class="step-num">${c.step===3?icon('check',13):'2'}</span>Fotos, videos y opciones</div><div class="step-line"></div><div class="step ${c.step===3?'active':''}"><span class="step-num">3</span>Vista previa</div></div>`}
function renderComposeStep1(c){return `<section class="form-card"><h2 class="form-section-title">Contá qué querés compartir</h2><p class="form-section-subtitle">Primero armá el contenido. Podés guardar un borrador incluso si todavía está incompleto.</p><div class="form-stack">${c.type==='professional'?`<div class="field"><label for="composer-text">Tu publicación</label><textarea class="composer-text" id="composer-text" data-composer="text" maxlength="3000" placeholder="Compartí un aprendizaje, un proyecto, una experiencia o una idea profesional…">${html(c.text)}</textarea><div class="char-row"><span>Escribí con tu propia voz</span><span>${c.text.length}/3000</span></div></div>`:`<div class="field"><label for="composer-title">Título de la oferta *</label><input id="composer-title" data-composer="title" maxlength="100" value="${html(c.title)}" placeholder="Ej. Asistente administrativo/a"></div><div class="profile-edit-grid"><div class="field"><label for="composer-company">Empresa o empleador</label><input id="composer-company" data-composer="company" value="${html(c.company)}" placeholder="Nombre de la empresa"></div><div class="field"><label for="composer-zone">Ciudad o zona general *</label><input id="composer-zone" data-composer="zone" value="${html(c.zone)}" placeholder="Ej. Palermo, CABA"></div></div><div class="field"><label for="composer-text">Descripción de la propuesta *</label><textarea id="composer-text" data-composer="text" maxlength="3000" placeholder="Tareas, responsabilidades y condiciones…">${html(c.text)}</textarea></div><div class="profile-edit-grid"><div class="field"><label for="composer-modality">Modalidad laboral</label><select id="composer-modality" data-composer="modality"><option ${c.modality==='Por día'?'selected':''}>Por día</option><option ${c.modality==='Temporal'?'selected':''}>Temporal</option><option ${c.modality==='Permanente'?'selected':''}>Permanente</option><option ${c.modality==='Pasantía remunerada'?'selected':''}>Pasantía remunerada</option></select></div><div class="field"><label for="composer-workmode">Forma de trabajo</label><select id="composer-workmode" data-composer="workMode"><option ${c.workMode==='Presencial'?'selected':''}>Presencial</option><option ${c.workMode==='Híbrido'?'selected':''}>Híbrido</option><option ${c.workMode==='Remoto'?'selected':''}>Remoto</option></select></div><div class="field"><label for="composer-pay">Remuneración *</label><input id="composer-pay" data-composer="pay" value="${html(c.pay)}" placeholder="Ej. $850.000"></div><div class="field"><label for="composer-period">Unidad de pago</label><select id="composer-period" data-composer="payPeriod"><option value="día" ${c.payPeriod==='día'?'selected':''}>Por día</option><option value="mes" ${c.payPeriod==='mes'?'selected':''}>Por mes</option><option value="total" ${c.payPeriod==='total'?'selected':''}>Total de la tarea</option><option value="a convenir" ${c.payPeriod==='a convenir'?'selected':''}>A convenir</option></select></div></div>`}</div><div class="form-footer"><button class="btn btn-secondary" data-action="save-draft">${icon('file',15)} Guardar borrador</button><span class="autosave" id="autosave-status">${icon('check',12)} Guardado automáticamente</span><button class="btn btn-primary" data-action="composer-next">Continuar ${icon('arrow',14)}</button></div></section>`}
function renderMediaTiles(c){return c.media.map((m,i)=>`<div class="media-tile" draggable="true" data-media-index="${i}" title="Arrastrá para cambiar el orden">${m.type==='video'?`<video src="${html(m.src)}" muted playsinline></video>`:`<img src="${html(m.src)}" alt="${html(m.name)}">`}<span class="media-index">${i+1}</span><button class="remove-media" data-action="remove-media" data-index="${i}" aria-label="Quitar archivo">${icon('close',13)}</button></div>`).join('')}
function renderComposeStep2(c){return `<section class="form-card"><h2 class="form-section-title">Dale forma a tu publicación</h2><p class="form-section-subtitle">Agregá fotos o videos, ordenalos y elegí las opciones que quieras.</p><label class="media-drop" for="media-input"><span style="width:42px;height:42px;background:#edf7dd;color:#597d2a;display:grid;place-items:center;border-radius:13px">${icon('image',20)}</span><strong>Sumá fotos o videos</strong><span>${c.type==='professional'?'Necesitás al menos una foto o un video para publicar.':'La multimedia es opcional para las ofertas laborales.'}<br>Podés seleccionar varios archivos a la vez.</span><span class="btn btn-secondary btn-small">${icon('plus',13)} Elegir archivos</span></label><input class="hidden" id="media-input" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime" multiple><div class="media-grid" id="media-grid">${renderMediaTiles(c)}</div>${c.media.length?'<div class="reorder-note">Mantené presionado un archivo y arrastralo para cambiar el orden.</div>':''}${c.type==='professional'?`<div class="subtle-divider"></div><div class="field"><label>Habilidades relacionadas (opcional)</label><div class="skill-select" style="margin-top:5px">${state.profile.skills.map(s=>`<button class="skill-choice ${(c.skills||[]).includes(s)?'active':''}" data-action="toggle-skill" data-skill="${html(s)}">${(c.skills||[]).includes(s)?icon('check',12):icon('plus',12)} ${html(s)}</button>`).join('')}</div></div>`:`<div class="subtle-divider"></div><div class="profile-edit-grid"><div class="field"><label for="composer-schedule">Horario o jornada</label><input id="composer-schedule" data-composer="schedule" value="${html(c.schedule)}" placeholder="A coordinar"></div><div class="field"><label for="composer-extra">Requisitos principales</label><input id="composer-extra" data-composer="description" value="${html(c.description)}" placeholder="Experiencia, habilidades…"></div></div>`}<div class="form-footer"><button class="btn btn-secondary" data-action="composer-back">${icon('chevron',14)} Volver al contenido</button><span class="autosave" id="autosave-status">${icon('check',12)} Guardado automáticamente</span><button class="btn btn-primary" data-action="composer-preview">Vista previa ${icon('arrow',14)}</button></div></section>`}
function renderPreview(c){const isOffer=c.type==='offer';return `<section class="form-card"><h2 class="form-section-title">Así se va a ver</h2><p class="form-section-subtitle">Revisá el contenido antes de publicarlo. Podés volver y modificarlo.</p><div class="preview-box"><div class="preview-label">Vista previa de la publicación</div>${isOffer?`<article class="post-card offer-card" style="box-shadow:none;margin:0"><div class="offer-top"><span class="offer-label">${icon('briefcase',13)} Oferta laboral</span><span class="offer-mode">${html(c.modality)}</span></div><h2 class="offer-title">${html(c.title||'Título de la oferta')}</h2><div class="offer-company"><div class="company-avatar">${html((c.company||state.profile.name).split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())}</div><strong>${html(c.company||state.profile.name)}</strong></div><p class="post-text" style="margin-top:13px">${html(c.text||'Descripción de la oferta')}</p><div class="offer-summary"><span>${icon('pin',14)} ${html(c.zone||'Ciudad o zona')}</span><span>${icon('clock',14)} ${html(c.workMode)}</span></div>${c.pay?`<p class="offer-pay">${html(c.pay)} <span style="font-size:11px;color:#7b837c;font-weight:650">${html(c.payPeriod)}</span></p>`:''}</article>`:`<div class="post-head" style="padding:8px 0 12px"><img class="avatar" src="${html(state.profile.avatar)}" alt=""><div class="person-meta"><div class="person-name">${html(state.profile.name)}</div><div class="person-sub">${html(state.profile.role)} · ${html(state.profile.zone)}</div><div class="person-sub">Ahora</div></div></div><div class="post-body" style="padding:0"><p class="post-text">${html(c.text||'Tu texto va a aparecer acá.')}</p>${(c.skills||[]).length?`<div class="skill-row">${c.skills.map(s=>`<span class="skill-chip">${html(s)}</span>`).join('')}</div>`:''}</div>${c.media.length?`<div class="media-grid" style="margin:15px 0 0">${c.media.map((m,i)=>`<div class="media-tile">${m.type==='video'?`<video src="${html(m.src)}" muted></video>`:`<img src="${html(m.src)}" alt="">`}</div>`).join('')}</div>`:''}`}</div><div class="notice-box" style="margin-top:13px">${icon('shield',16)} Una vez publicada, no se podrá editar. Podrás archivarla; antes de publicar, todavía podés volver para corregirla.</div><div class="form-footer"><button class="btn btn-secondary" data-action="composer-back-media">${icon('chevron',14)} Volver y editar</button><button class="btn btn-primary" data-action="confirm-publish">${icon('check',15)} Publicar</button></div></section>`}
function renderPublish(){const c=getComposer();return `<div class="publish-layout">${pageHead('Publicar','Compartí una idea profesional o acercá una oportunidad laboral.','Hacé que pase')} ${renderDrafts()}<div class="type-selector"><button class="type-option ${c.type==='professional'?'active':''}" data-action="composer-type" data-type="professional"><span class="type-symbol">${icon('spark',18)}</span><span><strong>Publicación profesional</strong><small>Ideas, proyectos y experiencias</small></span></button><button class="type-option ${c.type==='offer'?'active':''}" data-action="composer-type" data-type="offer"><span class="type-symbol">${icon('briefcase',18)}</span><span><strong>Oferta laboral</strong><small>Una propuesta de trabajo</small></span></button></div>${renderComposerSteps(c)}${c.step===1?renderComposeStep1(c):c.step===2?renderComposeStep2(c):renderPreview(c)}<p class="muted" style="font-size:10px;text-align:center;margin:13px 0 0">Tu contenido no se publica hasta que confirmes con el botón «Publicar».</p></div>`}
function renderMessageList(){return `<div class="message-panel"><div class="message-list-head"><h2>Mensajes</h2><p>Conversaciones y oportunidades</p></div><div class="conversation-list">${conversations.map(c=>`<button class="conversation-item ${state.selectedChat===c.id?'active':''}" data-action="select-chat" data-id="${c.id}"><img class="avatar" src="${html(c.avatar)}" alt="" onerror="this.src='${avatarA}'"><span class="conversation-meta"><strong>${html(c.name)}</strong><small>${html(c.preview)}</small></span>${c.unread?`<span class="unread-count">${c.unread}</span>`:''}</button>`).join('')}</div></div>`}
function renderChat(){const conv=conversations.find(c=>c.id===state.selectedChat)||conversations[0];const msgs=state.conversationMessages[conv.id]||seedMessages[conv.id]||[];return `<div class="message-panel"><div class="chat-header"><img class="avatar" src="${html(conv.avatar)}" alt=""><div style="flex:1"><strong>${html(conv.name)}</strong><small>${html(conv.role)}</small></div><button class="icon-btn" style="width:36px;height:36px" data-action="open-person" data-id="${conv.id==='chat2'?'person-mateo':'person-sofi'}" aria-label="Ver perfil">${icon('eye',15)}</button></div><div class="chat-content"><p class="chat-date">Hoy · La conversación sigue acá</p>${msgs.map(m=>`<div class="message-bubble ${m.from==='out'?'outgoing':'incoming'}">${html(m.text)}<span class="message-time">${html(m.time||'Ahora')}</span></div>`).join('')}${conv.id==='chat1'?`<div class="final-offer-card"><div class="final-offer-top">${icon('file',17)}<div><strong>Propuesta laboral final</strong><small>Enviada por ${html(conv.name)} · Para revisar</small></div></div><div class="final-offer-body"><div class="final-offer-title">Diseñador/a gráfico/a</div><div class="offer-detail-grid"><div class="detail-cell"><small>Modalidad</small><strong>Híbrido · Permanente</strong></div><div class="detail-cell"><small>Remuneración</small><strong>$950.000 por mes</strong></div><div class="detail-cell"><small>Ubicación</small><strong>Palermo, CABA</strong></div><div class="detail-cell"><small>Jornada</small><strong>A coordinar</strong></div></div><p class="muted" style="font-size:11px;line-height:1.6;margin:12px 0 0">Tareas de diseño visual, desarrollo de piezas digitales y colaboración con el equipo creativo.</p></div><div class="final-offer-foot"><small>${state.offerAcceptedByMe?'Aceptaste la propuesta. Falta la aceptación de la otra parte.':'La contratación se confirma cuando ambas partes aceptan esta misma propuesta.'}</small><button class="btn ${state.offerAcceptedByMe?'btn-secondary':'btn-primary'} btn-small" data-action="accept-offer" ${state.offerAcceptedByMe?'disabled':''}>${state.offerAcceptedByMe?'Aceptada por vos':'Aceptar propuesta'}</button></div></div>`:''}</div><form class="chat-compose" data-form="message"><input class="chat-input" name="message" placeholder="Escribí un mensaje…" maxlength="2000" required aria-label="Mensaje"><button class="btn btn-primary" type="submit" aria-label="Enviar mensaje">${icon('send',16)}</button></form></div>`}

function openModal(title,body,footer=''){const root=$('#overlay-root');root.innerHTML=`<div class="modal-backdrop" data-action="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${html(title)}"><header class="modal-head"><h2>${html(title)}</h2><button class="icon-btn" style="width:34px;height:34px;border-radius:10px" data-action="close-modal" aria-label="Cerrar">${icon('close',15)}</button></header><div class="modal-body">${body}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:''}</section></div>`;document.body.style.overflow='hidden';const first=$('input,textarea,button,select',root);if(first)first.focus({preventScroll:true})}

function publishValidate(c){if(c.type==='professional'){if(!c.text.trim())return'Agregá el texto de tu publicación.';if(!c.media.length)return'Agregá al menos una foto o un video a la publicación profesional.';}else{if(!c.title.trim())return'Completá el título de la oferta laboral.';if(!c.text.trim())return'Completá la descripción de la oferta.';if(!c.zone.trim())return'Indicá la ciudad o zona general.';if(!c.pay.trim())return'Indicá la remuneración de la oferta.';}return''}
function saveManualDraft(){const c=state.composer;const d=composerToDraft(c);if(!d.text.trim()&&!d.title.trim()&&!d.zone.trim()&&!d.pay.trim()){showToast('Agregá algo al borrador antes de guardarlo.');return}d.id=d.id&&d.id!=='draft-current'?d.id:'draft-'+Date.now();d.updatedAt=Date.now();state.composer.id=d.id;const idx=state.drafts.findIndex(x=>x.id===d.id);if(idx>=0)state.drafts[idx]=d;else state.drafts.unshift(d);persist();storeValue('rsl-current-draft',JSON.stringify(d));render();showToast('Borrador guardado. Podés continuar después.');}
function completePublish(){const c=state.composer;const error=publishValidate(c);if(error){showToast(error);return}const p={id:'post-'+Date.now(),type:c.type,author:c.type==='offer'?(c.company.trim()||state.profile.name):state.profile.name,company:c.company||state.profile.name,role:c.type==='offer'?'Empleador':state.profile.role,zone:c.zone||state.profile.zone,avatar:c.type==='offer'?null:state.profile.avatar,time:'Ahora',createdAt:Date.now(),text:c.text,title:c.title,modality:c.modality,workMode:c.workMode,pay:c.pay,payPeriod:c.payPeriod,detail:c.text,description:c.description,requirements:c.description,skills:c.skills||[],media:c.media.map(m=>({src:m.src,type:m.type,name:m.name})),likes:0,comments:[],liked:false,isMine:true};state.posts.unshift(p);if(c.id&&c.id!=='draft-current')state.drafts=state.drafts.filter(d=>d.id!==c.id);state.composer=null;state.publishedNotice=true;state.unread+=1;removeStoredValue('rsl-current-draft');persist();state.tab='inicio';render();window.scrollTo({top:0,behavior:'smooth'});showToast('¡Publicado! Ya aparece en Inicio.');}
function openOfferApply(p){const body=`<form id="apply-form"><p style="font-size:13px;line-height:1.65;color:#59635b;margin:0 0 16px">Vas a postularte a <strong>${html(p.title)}</strong>. Se comparte tu perfil profesional; podés sumar un mensaje breve.</p><div class="field"><label for="apply-message">Mensaje opcional</label><textarea id="apply-message" name="message" maxlength="800" placeholder="Hola, me interesa la propuesta porque…"></textarea></div></form>`;openModal('Postularme a la oferta',body,'<button class="btn btn-secondary" data-action="close-modal">Cancelar</button><button class="btn btn-primary" data-action="submit-application">Enviar postulación</button>')}

:state.selectedChat=id;const c=conversations.find(c=>c.id===id);if(c)c.unread=0;render();break;case'accept-offer':state.offerAcceptedByMe=true;persist();render();showToast('Aceptaste la propuesta. Falta la aceptación de la otra parte.');break;case'start-conversation':state.viewingPerson=null;state.tab='mensajes';state.selectedChat=id==='person-mateo'?'chat2':'chat1';render();break;case'share-person':showToast('Perfil listo para compartir.');break;default:break}}
document.addEventListener('click',e=>{const actionEl=e.target.closest('[data-action]');if(actionEl){if(actionEl.dataset.action==='modal-backdrop'&&e.target!==actionEl)return;e.preventDefault();handleAction(actionEl.dataset.action,actionEl);return}const tabEl=e.target.closest('[data-tab]');if(tabEl){e.preventDefault();setTab(tabEl.dataset.tab)}});

function setAppVisibility(visible){

  setAppVisibility(false);
  const root=$('#overlay-root');
  root.innerHTML=`<div class="modal-backdrop" style="z-index:100"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="auth-title"><div class="modal-head"><h2 id="auth-title">Red Social Laboral</h2></div><div class="modal-body"><div style="text-align:center;padding:15px 0 8px"><div style="width:62px;height:62px;border-radius:20px;background:#eff8dd;display:grid;place-items:center;margin:0 auto 15px;color:#4c6d22">${icon('briefcase',28)}</div><h2 style="font-size:23px;letter-spacing:-.8px;margin:0 0 8px">Tu próximo paso laboral empieza acá</h2><p style="color:#737b76;font-size:13px;line-height:1.6;margin:0 auto 20px;max-width:350px">${html(message)}</p><button id="google-sign-in" class="btn btn-dark" style="width:100%;min-height:48px" ${authBusy?'disabled':''}><span style="font-size:16px;font-weight:900">G</span> ${authBusy?'Conectando…':'Continuar con Google'}</button><p id="auth-error" style="color:#b94a46;font-size:12px;line-height:1.5;margin:12px 0 0"></p><p style="font-size:10px;color:#8a918b;line-height:1.6;margin:18px 0 0">Al continuar, tu cuenta se crea en Supabase. La publicación, búsqueda y mensajería se conectarán por etapas; esta versión todavía conserva partes de demostración.</p></div></div></section></div>`;
  $('#google-sign-in')?.addEventListener('click', async()=>{
    if(!supabaseClient){$('#auth-error').textContent='No se pudo cargar el cliente de Supabase. Revisá la conexión a internet.';return;}
    authBusy=true;$('#google-sign-in').disabled=true;$('#google-sign-in').textContent='Conectando…';

function profileToRow(p,user){return {account_id:user.id,display_name:p.name||'',photo_path:null,intro:p.intro||'',city:(p.zone||'').split(',').slice(-1)[0].trim(),general_zone:p.zone||'',availability:p.availability==='Disponible de inmediato'?'available_now':p.availability==='Temporalmente no disponible'?'temporarily_unavailable':'from_date',skills:Array.isArray(p.skills)?p.skills:[],experience:p.experience||'',education:p.education||'',portfolio:p.portfolio?[{description:p.portfolio}]:[],mobility:p.mobility?[p.mobility]:[],desired_modalities:p.modality?[p.modality]:[],salary_expectations:p.expectations||null,visibility:p.visibility==='private'?'private':'employers',updated_at:new Date().toISOString()};}
function rowToProfile(row){return {...state.profile,name:row.display_name||state.profile.name,intro:row.intro||'',zone:row.general_zone||row.city||state.profile.zone,availability:row.availability==='available_now'?'Disponible de inmediato':row.availability==='temporarily_unavailable'?'Temporalmente no disponible':'Disponible desde una fecha',skills:row.skills||[],experience:row.experience||'',education:row.education||'',portfolio:row.portfolio?.[0]?.description||'',mobility:(row.mobility||[]).join(', '),modality:(row.desired_modalities||[]).join(', '),expectations:row.salary_expectations||'',visibility:row.visibility||'employers'};}
async function ensureAccountAndProfile(user){
  // The auth trigger creates accounts; read/update the profile only through its own RLS policy.
  const {data:account,error:accountError}=await supabaseClient.from('accounts').select('id,state,last_active_profile').eq('id',user.id).maybeSingle();
  if(accountError) throw accountError;
  if(account?.state==='suspended'||account?.state==='deleted') throw new Error('La cuenta no está habilitada. Contactá al equipo de soporte.');
  let {data:profile,error}=await supabaseClient.from('worker_profiles').select('*').eq('account_id',user.id).maybeSingle();
  if(error) throw error;
  if(!profile){
    const seed=profileToRow(state.profile,user);
    const result=await supabaseClient.from('worker_profiles').insert(seed).select('*').single();
    if(result.error) throw result.error;
    profile=result.data;
  } else {state.profile=rowToProfile(profile);persist();}
  await supabaseClient.from('accounts').update({last_active_profile:'worker',updated_at:new Date().toISOString()}).eq('id',user.id);
}
async function saveWorkerProfileToSupabase(){
  if(!authenticatedUser||!supabaseClient) return;
  const payload=profileToRow(state.profile,authenticatedUser);
  const {error}=await supabaseClient.from('worker_profiles').update(payload).eq('account_id',authenticatedUser.id);
  if(error) throw error;
}
async function enterAuthenticatedApp(user){
  authenticatedUser=user;authBusy=false;
  try{await ensureAccountAndProfile(user);$('#overlay-root').innerHTML='';setAppVisibility(true);render();}
  catch(error){authenticatedUser=null;showAuthScreen('No pudimos cargar tu perfil: '+(error?.message||'error desconocido'));const e=$('#auth-error');if(e)e.textContent=error?.message||'Error de conexión';}
}
async function bootAuth(){
  if(!supabaseClient){showAuthScreen('No se pudo iniciar la conexión. Necesitás conexión a internet para cargar Supabase.');return;}
  showAuthScreen();
  const {data:{session},error}=await supabaseClient.auth.getSession();
  if(error){showAuthScreen('No se pudo comprobar tu sesión. Intentá nuevamente.');return;}
  if(session?.user) await enterAuthenticatedApp(session.user);
  supabaseClient.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'){authenticatedUser=null;showAuthScreen('Cerraste sesión. Podés volver a entrar con Google.');}
    else if(event==='SIGNED_IN'&&session?.user&&!authenticatedUser){setTimeout(()=>enterAuthenticatedApp(session.user),0);}
  });
}
document.addEventListener('click',async e=>{
  if(e.target.closest('#sign-out-btn')){if(supabaseClient)await supabaseClient.auth.signOut();return;}
});
// Start the connected copy behind Google authentication. Demo feed interactions are not yet persisted remotely.
bootAuth();
