async function loadRemoteConversations(){
 if(!authenticatedUser||!supabaseClient){state.remoteConversations=[];return;}
 const {data:members,error}=await supabaseClient.from('conversation_members').select('conversation_id,account_id,last_read_at').eq('account_id',authenticatedUser.id);
 if(error)throw error;const ids=[...new Set((members||[]).map(m=>m.conversation_id))];
 if(!ids.length){state.remoteConversations=[];state.selectedRemoteConversation=null;return;}
 const {data:convs,error:convError}=await supabaseClient.from('conversations').select('id,offer_id,created_by,created_at').in('id',ids).order('created_at',{ascending:false});if(convError)throw convError;
 const {data:allMembers,error:memError}=await supabaseClient.from('conversation_members').select('conversation_id,account_id').in('conversation_id',ids);if(memError)throw memError;
 const otherIds=[...new Set((allMembers||[]).filter(m=>m.account_id!==authenticatedUser.id).map(m=>m.account_id))];
 let accounts={};if(otherIds.length){const {data:acc,error:accError}=await supabaseClient.from('accounts').select('id,email').in('id',otherIds);if(!accError)(acc||[]).forEach(a=>accounts[a.id]=a);}
 let workers={};if(otherIds.length){const {data:wp}=await supabaseClient.from('worker_profiles').select('account_id,display_name,professional_title,photo_path').in('account_id',otherIds);(wp||[]).forEach(w=>workers[w.account_id]=w);}
 let employers={};if(otherIds.length){const {data:ep}=await supabaseClient.from('employer_profiles').select('account_id,display_name,verification_state').in('account_id',otherIds);(ep||[]).forEach(w=>employers[w.account_id]=w);}
 const {data:msgs,error:msgError}=await supabaseClient.from('messages').select('id,conversation_id,sender_account_id,body,created_at').in('conversation_id',ids).order('created_at',{ascending:true});if(msgError)throw msgError;
 state.remoteConversations=(convs||[]).map(c=>{const other=(allMembers||[]).find(m=>m.conversation_id===c.id&&m.account_id!==authenticatedUser.id)?.account_id;const prof=workers[other]||employers[other]||{};const ownmsgs=(msgs||[]).filter(m=>m.conversation_id===c.id);const last=ownmsgs[ownmsgs.length-1];return {...c,otherAccountId:other,name:prof.display_name||accounts[other]?.email?.split('@')[0]||'Contacto',role:prof.professional_title||(employers[other]?'Empleador':'Contacto'),preview:last?.body||'Conversación iniciada',messages:ownmsgs.map(m=>({id:m.id,from:m.sender_account_id===authenticatedUser.id?'out':'in',text:m.body,time:new Date(m.created_at).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}))};});
 if(!state.selectedRemoteConversation||!state.remoteConversations.some(c=>c.id===state.selectedRemoteConversation))state.selectedRemoteConversation=state.remoteConversations[0]?.id||null;
 if(state.selectedRemoteConversation)await loadRemoteConversationDetails(state.selectedRemoteConversation);
}
async function loadRemoteConversationDetails(id){
 if(!authenticatedUser||!supabaseClient||!id)return;
 const {data:offers,error}=await supabaseClient.from('final_offers').select('id,conversation_id,created_by,conditions,revision,status,expires_at,created_at').eq('conversation_id',id).order('created_at',{ascending:false});if(error)throw error;
 state.remoteFinalOffers=await Promise.all((offers||[]).map(async o=>{const {data:accepted,error:ae}=await supabaseClient.from('final_offer_acceptances').select('account_id,accepted_at').eq('final_offer_id',o.id);return {...o,acceptances:ae?[]:(accepted||[])};}));
 const {data:hirings,error:he}=await supabaseClient.from('hirings').select('id,final_offer_id,status,confirmed_at').eq('conversation_id',id);state.remoteHirings=he?[]:(hirings||[]);
}
async function startRemoteConversation(accountId,offerId=null){
 if(!authenticatedUser||!supabaseClient){showToast('Iniciá sesión para enviar mensajes reales.');return;}

async function loadRemoteFeed(){if(!authenticatedUser||!supabaseClient)return;const {data:rows,error}=await supabaseClient.from('posts').select('*,worker_profiles(display_name,photo_path),employer_profiles(display_name,logo_path),post_media(id,storage_path,media_type,mime_type,sort_order),post_likes(account_id),comments(id,author_account_id,body,created_at,accounts(email))').in('status',['published','archived']).order('published_at',{ascending:false}).limit(50);dbError(error);const ownId=authenticatedUser.id;const remotes=await Promise.all((rows||[]).map(async row=>{const profile=row.worker_profiles||row.employer_profiles||{};let authorAvatarUrl='';if(profile.photo_path){const {data:photo}=await supabaseClient.storage.from('profile-media').createSignedUrl(profile.photo_path,3600);authorAvatarUrl=photo?.signedUrl||'';}const media=(row.post_media||[]).sort((a,b)=>a.sort_order-b.sort_order).map(m=>({src:supabaseClient.storage.from('post-media').getPublicUrl(m.storage_path).data.publicUrl,type:m.media_type,name:'Archivo compartido'}));const comments=(row.comments||[]).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(c=>({name:c.author_account_id===ownId?'Vos':(c.accounts?.email||'Usuario').split('@')[0],text:c.body,remoteId:c.id,isMine:c.author_account_id===ownId}));const liked=(row.post_likes||[]).some(x=>x.account_id===ownId);const post=mapRemotePost({...row,likes_count:(row.post_likes||[]).length,author_name:profile.display_name||'Usuario',author_avatar:authorAvatarUrl},media,comments,liked,false);remotePostIds.add(String(post.id));if(liked)remoteLikeIds.add(String(post.id));return post;}));state.posts=[...remotes.filter(p=>p.status==='published'),...state.posts.filter(p=>!p.remote)];state.archived=[...remotes.filter(p=>p.status==='archived'),...state.archived.filter(p=>!p.remote)];const {data:saved,error:savedError}=await supabaseClient.from('saved_items').select('item_id').eq('account_id',ownId).eq('item_type','post');dbError(savedError);(saved||[]).forEach(x=>{remoteSavedIds.add(String(x.item_id));state.savedIds.push(String(x.item_id));});state.savedIds=[...new Set(state.savedIds)];state.posts.forEach(p=>{if(p.remote)p.saved=remoteSavedIds.has(String(p.id));});const {data:draftRows,error:draftError}=await supabaseClient.from('posts').select('id,body,kind,zone,looking_activity,looking_availability,created_at,updated_at').eq('author_account_id',ownId).eq('status','draft').order('updated_at',{ascending:false});dbError(draftError);const remoteDrafts=(draftRows||[]).map(r=>{let payload={};try{payload=JSON.parse(r.body||'{}')}catch{}return {...payload,id:r.id,remoteDraft:true,updatedAt:new Date(r.updated_at||r.created_at).getTime(),media:[]};});state.drafts=[...remoteDrafts,...state.drafts.filter(d=>!d.remoteDraft)];persist();}
async function saveRemotePostStatus(postId,status){if(!authenticatedUser||!isRemotePost({id:postId}))return;const updates=status==='archived'?{status:'archived',archived_at:new Date().toISOString()}:{status:'published',archived_at:null};const {error}=await supabaseClient.from('posts').update(updates).eq('id',postId).eq('author_account_id',authenticatedUser.id);dbError(error);}

function setAppVisibility(visible){
  $('#app').style.display = visible ? '' : 'none';
  $('.fixed-nav-wrap').style.display = visible ? '' : 'none';
  const actions=$('#top-actions');
  if(actions) actions.innerHTML = visible ? `<button class="btn btn-secondary btn-small" id="sign-out-btn" type="button">Cerrar sesión</button><button class="icon-btn" data-action="notifications" aria-label="Notificaciones" title="Notificaciones"><span class="notification-dot" id="notification-dot"></span>${icon('spark',18)}</button><button class="icon-btn" data-action="my-profile" aria-label="Mi perfil" title="Mi perfil" style="padding:0;overflow:hidden"><img class="mini-avatar" id="top-avatar" alt="Foto de perfil" src="${html(state.profile.avatar||avatarB)}" style="width:100%;height:100%;border:0;border-radius:0"></button>` : '';
}
function showAuthScreen(message='Ingresá para usar tu espacio profesional.'){
  setAppVisibility(false);
  const root=$('#overlay-root');
  root.innerHTML=`<div class="modal-backdrop" style="z-index:100"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="auth-title"><div class="modal-head"><h2 id="auth-title">Red Social Laboral</h2></div><div class="modal-body"><div style="text-align:center;padding:15px 0 8px"><div style="width:62px;height:62px;border-radius:20px;background:#eff8dd;display:grid;place-items:center;margin:0 auto 15px;color:#4c6d22">${icon('briefcase',28)}</div><h2 style="font-size:23px;letter-spacing:-.8px;margin:0 0 8px">Tu próximo paso laboral empieza acá</h2><p style="color:#737b76;font-size:13px;line-height:1.6;margin:0 auto 20px;max-width:350px">${html(message)}</p><button id="google-sign-in" class="btn btn-dark" style="width:100%;min-height:48px" ${authBusy?'disabled':''}><span style="font-size:16px;font-weight:900">G</span> ${authBusy?'Conectando…':'Continuar con Google'}</button><p id="auth-error" style="color:#b94a46;font-size:12px;line-height:1.5;margin:12px 0 0"></p><p style="font-size:10px;color:#8a918b;line-height:1.6;margin:18px 0 0">Al continuar, tu cuenta se crea en Supabase. La publicación, búsqueda y mensajería se conectarán por etapas; esta versión todavía conserva partes de demostración.</p></div></div></section></div>`;
  $('#google-sign-in')?.addEventListener('click', async()=>{
    if(!supabaseClient){$('#auth-error').textContent='No se pudo cargar el cliente de Supabase. Revisá la conexión a internet.';return;}
    authBusy=true;$('#google-sign-in').disabled=true;$('#google-sign-in').textContent='Conectando…';
    const {error}=await supabaseClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:(window.location.protocol==='file:'?'http://localhost:4173/':window.location.href.split('#')[0])}});
    if(error){authBusy=false;$('#auth-error').textContent=error.message;$('#google-sign-in').disabled=false;$('#google-sign-in').textContent='Continuar con Google';}
  });
}
function profileToRow(p,user){const zone=String(p.zone||'').trim();const row={account_id:user.id,display_name:String(p.name||'').trim(),professional_title:String(p.role||'').trim(),intro:String(p.intro||'').trim(),city:zone.split(',').slice(-1)[0].trim(),general_zone:zone,availability:p.availability==='Disponible de inmediato'?'available_now':p.availability==='Temporalmente no disponible'?'temporarily_unavailable':'from_date',skills:Array.isArray(p.skills)?p.skills:[],experience:p.experience||null,education:p.education||null,portfolio:Array.isArray(p.portfolioItems)?p.portfolioItems:(p.portfolio?[{description:p.portfolio}]:[]),mobility:p.mobility?String(p.mobility).split(',').map(x=>x.trim()).filter(Boolean):[],desired_modalities:p.modality?String(p.modality).split(',').map(x=>x.trim()).filter(Boolean):[],salary_expectations:p.expectations||null,visibility:p.visibility==='private'?'private':p.visibility==='app'||p.visibility==='app_users'?'app_users':'employers',updated_at:new Date().toISOString()};if(p.photoPath)row.photo_path=p.photoPath;return row;}
function rowToProfile(row){return {...state.profile,name:row.display_name||'',role:row.professional_title||'',photoPath:row.photo_path||'',avatar:state.profile.avatar,intro:row.intro||'',zone:row.general_zone||row.city||'',availability:row.availability==='available_now'?'Disponible de inmediato':row.availability==='temporarily_unavailable'?'Temporalmente no disponible':'Desde una fecha',skills:row.skills||[],experience:row.experience||'',education:row.education||'',portfolioItems:Array.isArray(row.portfolio)?row.portfolio:[],portfolio:row.portfolio?.[0]?.description||'',mobility:(row.mobility||[]).join(', '),modality:(row.desired_modalities||[]).join(', '),expectations:row.salary_expectations||'',visibility:row.visibility==='app_users'?'app':row.visibility||'employers'};}
async function ensureAccountAndProfile(user){
  // The auth trigger creates accounts; read/update the profile only through its own RLS policy.
  const {data:account,error:accountError}=await supabaseClient.from('accounts').select('id,state,last_active_profile').eq('id',user.id).maybeSingle();
  if(accountError) throw accountError;
  if(account?.state==='suspended'||account?.state==='deleted') throw new Error('La cuenta no está habilitada. Contactá al equipo de soporte.');
  let {data:profile,error}=await supabaseClient.from('worker_profiles').select('*').eq('account_id',user.id).maybeSingle();
  if(error) throw error;
  if(!profile){
    state.profile=blankProfileForUser(user);
    const seed=profileToRow(state.profile,user);
    const result=await supabaseClient.from('worker_profiles').insert(seed).select('*').single();
    if(result.error) throw result.error;
    profile=result.data;
    state.profile={...blankProfileForUser(user),...rowToProfile(profile)};
    persist();
  } else {
    state.profile={...blankProfileForUser(user),...rowToProfile(profile)};
    if(!state.profile.avatar)state.profile.avatar=String(user?.user_metadata?.avatar_url||user?.user_metadata?.picture||'');
    persist();
  }
  currentWorkerProfileId=profile.id;
  if(profile.photo_path){const {data:photo}=await supabaseClient.storage.from('profile-media').createSignedUrl(profile.photo_path,3600);if(photo?.signedUrl)state.profile.avatar=photo.signedUrl;}
  const {error:lastProfileError}=await supabaseClient.from('accounts').update({last_active_profile:'worker',updated_at:new Date().toISOString()}).eq('id',user.id);
  if(lastProfileError) throw lastProfileError;
  await loadRemoteFeed();
}
async function saveWorkerProfileToSupabase(photoFile=null){
  if(!authenticatedUser||!supabaseClient) return;
  if(photoFile){if(!/^image\/(jpeg|png|webp)$/.test(photoFile.type)||photoFile.size>8*1024*1024)throw new Error('La foto debe ser JPG, PNG o WebP y pesar hasta 8 MB.');const ext=photoFile.type==='image/png'?'png':photoFile.type==='image/webp'?'webp':'jpg';const path=`${authenticatedUser.id}/avatar-${Date.now()}.${ext}`;const {error:uploadError}=await supabaseClient.storage.from('profile-media').upload(path,photoFile,{upsert:true,contentType:photoFile.type});if(uploadError)throw uploadError;state.profile.photoPath=path;}
  const {data:existingProfile,error:existingError}=await supabaseClient.from('worker_profiles').select('photo_path').eq('account_id',authenticatedUser.id).single();
  if(existingError)throw existingError;
  const payload=profileToRow(state.profile,authenticatedUser);
  if(!payload.photo_path&&existingProfile?.photo_path)payload.photo_path=existingProfile.photo_path;
  const {error}=await supabaseClient.from('worker_profiles').update(payload).eq('account_id',authenticatedUser.id);
  if(error) throw error;
  const {data:row,error:readError}=await supabaseClient.from('worker_profiles').select('id,photo_path,intro_video_path,professional_title').eq('account_id',authenticatedUser.id).single();
  if(readError) throw readError;
  currentWorkerProfileId=row.id;state.profile.photoPath=row.photo_path||'';
  if(row.photo_path){const {data:photo,error:photoError}=await supabaseClient.storage.from('profile-media').createSignedUrl(row.photo_path,3600);if(!photoError&&photo?.signedUrl)state.profile.avatar=photo.signedUrl;}
}
async function loadEmployerApplications(){
 if(!authenticatedUser||!supabaseClient||!currentEmployerProfile||currentEmployerProfile.verification_state!=='verified')return [];
 const {data:offers,error}=await supabaseClient.from('job_offers').select('id,title,state').eq('employer_profile_id',currentEmployerProfile.id).order('created_at',{ascending:false});
 if(error)throw error;const ids=(offers||[]).map(o=>o.id);if(!ids.length)return [];
 const {data:apps,error:appError}=await supabaseClient.from('offer_applications').select('id,offer_id,worker_profile_id,account_id,message,state,created_at,worker_profiles(id,display_name,professional_title,general_zone,skills,visibility,profile_status)').in('offer_id',ids).order('created_at',{ascending:false});
 if(appError)throw appError;return (apps||[]).map(a=>({...a,offerTitle:offers.find(o=>o.id===a.offer_id)?.title||'Oferta laboral'}));

ork-mode">Modalidad de trabajo *</label><select id="job-work-mode" name="work_mode"><option value="on_site">Presencial</option><option value="hybrid">Híbrida</option><option value="remote">Remota</option></select></div><div class="field"><label for="job-pay-type">Remuneración *</label><select id="job-pay-type" name="pay_type"><option value="to_agree">A convenir</option><option value="fixed">Monto fijo</option><option value="range">Rango</option></select></div><div class="field"><label for="job-pay-amount">Monto (ARS, opcional)</label><input id="job-pay-amount" name="pay_amount" type="number" min="0" step="0.01"></div><div class="field"><label for="job-pay-period">Frecuencia</label><select id="job-pay-period" name="pay_period"><option value="monthly">Mensual</option><option value="weekly">Semanal</option><option value="daily">Diaria</option><option value="hourly">Por hora</option><option value="project">Por proyecto</option></select></div><div class="field field-full"><button class="btn btn-primary" type="submit">Publicar oferta</button></div></form><div class="subtle-divider"></div><div class="section-head"><h2>Postulaciones recibidas</h2><button class="btn btn-secondary btn-small" data-action="refresh-employer-applications">Actualizar</button></div><div id="employer-applications-list"><p class="muted">Cargá las postulaciones para ver las candidaturas.</p><button class="btn btn-secondary btn-small" data-action="refresh-employer-applications">Ver postulaciones</button></div></section>`;

async function refreshEmployerApplicationsUI(){const target=$('#employer-applications-list');if(!target)return;target.innerHTML='<p class="muted">Cargando postulaciones…</p>';try{const apps=await loadEmployerApplications();target.innerHTML=apps.length?apps.map(a=>`<article class="portfolio-item"><strong>${html(a.offerTitle)}</strong><p class="section-copy">${html(a.worker_profiles?.display_name||'Trabajador')} · ${html(a.worker_profiles?.professional_title||'Perfil profesional')} · ${html(a.worker_profiles?.general_zone||'Zona no indicada')}</p>${a.message?`<p class="section-copy">${html(a.message)}</p>`:''}<div class="offer-summary"><span>Estado: ${html(a.state)}</span><span>${html(new Date(a.created_at).toLocaleDateString('es-AR'))}</span></div><div class="right-action-row"><button class="btn btn-secondary btn-small" data-action="application-state" data-id="${html(a.id)}" data-state="reviewing">Marcar en revisión</button><button class="btn btn-primary btn-small" data-action="application-state" data-id="${html(a.id)}" data-state="shortlisted">Preseleccionar</button></div></article>`).join(''):'<p class="muted">Todavía no hay postulaciones para tus ofertas.</p>';}catch(err){target.innerHTML=`<p class="section-copy">No se pudieron cargar las postulaciones: ${html(err.message||'error')}</p>`;}}
async function loadRemoteJobOffers(){
 if(!authenticatedUser||!supabaseClient)return;
 const {data:ownEmployer,error:ownEmployerError}=await supabaseClient.from('employer_profiles').select('id,account_id,display_name,verification_state,city,general_zone').eq('account_id',authenticatedUser.id).maybeSingle();
 if(ownEmployerError)console.warn('No se pudo consultar el perfil empleador',ownEmployerError.message);
 currentEmployerProfile=ownEmployer||null;
 const {data:rows,error}=await supabaseClient.from('job_offers').select('*,employer_profiles(id,display_name,sector,city,general_zone,logo_path,verification_state)').eq('state','open').order('published_at',{ascending:false}).limit(100);
 if(error){console.warn('No se pudieron cargar ofertas laborales',error.message);state.remoteJobOffersLoaded=false;return;}
 state.remoteJobOffers=(rows||[]).filter(r=>r.employer_profiles?.verification_state==='verified').map(r=>({id:r.id,remote:true,remoteJobOffer:true,type:'offer',title:r.title,author:r.employer_profiles?.display_name||'Empleador verificado',company:r.employer_profiles?.display_name||'Empleador verificado',zone:[r.general_zone,r.city].filter(Boolean).join(', '),modality:r.modality||r.work_mode||'A coordinar',workMode:r.work_mode||'A coordinar',pay:r.pay_amount!=null?`${r.currency||'ARS'} ${Number(r.pay_amount).toLocaleString('es-AR')}`:r.pay_min!=null?`${r.currency||'ARS'} ${Number(r.pay_min).toLocaleString('es-AR')}${r.pay_max!=null?' – '+Number(r.pay_max).toLocaleString('es-AR'):''}`:'Remuneración a convenir',payPeriod:r.pay_period||'',text:r.description||'',detail:r.description||'',requirements:[r.requirements,r.tasks,r.experience_required].filter(Boolean).join('\n\n'),createdAt:new Date(r.published_at||r.created_at).getTime(),offerState:r.state,employerProfileId:r.employer_profile_id}));
 const {data:apps,error:appsError}=await supabaseClient.from('offer_applications').select('offer_id').eq('account_id',authenticatedUser.id);
 if(!appsError){state.myApplied=[...new Set([...(state.myApplied||[]),...(apps||[]).map(a=>a.offer_id)])];persist();}
 state.remoteJobOffersLoaded=true;
}
async function enterAuthenticatedApp(user){
  authenticatedUser=user;authBusy=false;
  try{await ensureAccountAndProfile(user);await Promise.all([loadRemoteFeed(),loadRemotePeople(),loadRemoteEmployers(),loadRemoteJobOffers(),loadRemoteConversations()]);$('#overlay-root').innerHTML='';setAppVisibility(true);render();await refreshNotificationCount();}
  catch(error){authenticatedUser=null;showAuthScreen('No pudimos cargar tu perfil: '+(error?.message||'error desconocido'));const e=$('#auth-error');if(e)e.textContent=error?.message||'Error de conexión';}
}
async function bootAuth(){
  if(!supabaseClient){showAuthScreen('No se pudo iniciar la conexión. Necesitás conexión a internet para cargar Supabase.');return;}
  showAuthScreen();
  const {data:{session},error}=await supabaseClient.auth.getSession();
  if(error){showAuthScreen('No se pudo comprobar tu sesión. Intentá nuevamente.');return;}
  if(session?.user) await enterAuthenticatedApp(session.user);
  supabaseClient.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'){authenticatedUser=null;currentEmployerProfile=null;currentWorkerProfileId=null;state.remoteConversations=[];state.selectedRemoteConversation=null;showAuthScreen('Cerraste sesión. Podés volver a entrar con Google.');}
    else if(event==='SIGNED_IN'&&session?.user&&!authenticatedUser){setTimeout(()=>enterAuthenticatedApp(session.user),0);}
  });
}
document.addEventListener('click',async e=>{
  if(e.target.closest('#sign-out-btn')){if(supabaseClient)await supabaseClient.auth.signOut();return;}
});
// Start the connected copy behind Google authentication. Demo feed interactions are not yet persisted remotely.
bootAuth();
